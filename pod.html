<style>
:root{--b1:#5aa0f0;--b2:#1f68d0;--pod-scale:1}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{height:100%;overscroll-behavior:none}
html,body{-webkit-text-size-adjust:100%}
body{min-height:100%;display:grid;place-items:center;align-content:center;gap:16px;
padding:calc(20px + env(safe-area-inset-top,0px)) 12px calc(20px + env(safe-area-inset-bottom,0px));
background:radial-gradient(90% 70% at 50% 0%,#3a3f4d,#15161b);color:#9a9fb0;font:13px/1.4 "Lucida Grande",Helvetica,Arial,sans-serif;
overscroll-behavior:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
#podwrap{width:340px;height:560px}
.pod{transform:scale(var(--pod-scale,1));transform-origin:top center}
button{font:inherit;border:0;background:none;cursor:pointer;color:inherit;touch-action:manipulation;-webkit-touch-callout:none}
.pod{--body:linear-gradient(155deg,#fafafa,#cfd1d5 50%,#eceded);--wh:radial-gradient(circle at 50% 30%,#fff,#dcdde0);--lbl:#8a8d94;--ctr:radial-gradient(circle at 50% 30%,#f4f4f5,#c9cacd);
width:340px;height:560px;border-radius:34px;padding:22px 22px 0;position:relative;user-select:none;-webkit-user-select:none;background:var(--body);
box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.75),inset 0 -6px 14px rgba(0,0,0,.14),0 30px 60px rgba(0,0,0,.55),0 0 0 1px #7c7e83}
.pod.black{--body:linear-gradient(155deg,#3d3e42,#131316 55%,#2a2b2e);--wh:radial-gradient(circle at 50% 30%,#3a3b3f,#1c1c1f);--lbl:#c9ccd2;--ctr:radial-gradient(circle at 50% 30%,#2c2d31,#0e0e10)}
.pod.blue{--body:linear-gradient(155deg,#a9d2f7,#4b8fd6 55%,#84baee);--wh:radial-gradient(circle at 50% 30%,#fff,#d3e2f2);--lbl:#6b7f99;--ctr:radial-gradient(circle at 50% 30%,#f4f8fc,#c3d2e2)}
.bez{background:#0c0c0d;border-radius:10px;padding:6px;box-shadow:0 1px 0 rgba(255,255,255,.6)}
.scr{position:relative;background:#fff;height:222px;overflow:hidden;color:#111;border-radius:3px}
.bar{height:26px;display:flex;align-items:center;padding:0 8px;background:linear-gradient(#f4f6fa,#c4cad6);border-bottom:1px solid #8b93a3;font-weight:700}
.bar i{font-style:normal;width:34px;font-size:10px;color:#3a4250}
.bar i:last-child{text-align:right}
#hd{flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#view{position:relative;height:195px;overflow:hidden}
.row{display:flex;align-items:center;height:24.375px;padding:0 14px 0 9px;gap:6px;white-space:nowrap}
.row .t{flex:1;overflow:hidden;text-overflow:ellipsis}
.row .r{color:#6d7480;font-size:11px}
.row.sel{background:linear-gradient(var(--b1),var(--b2));color:#fff}
.row.sel .r{color:#dbe9ff}
.sb{position:absolute;right:2px;width:4px;border-radius:2px;background:#9aa4b6}
.msg{padding:18px;color:#666;text-align:center}
.np{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:10px 10px 0;position:relative}
.npbg{position:absolute;left:-10px;right:-10px;top:-10px;bottom:-10px;background-size:cover;background-position:center;filter:blur(26px) brightness(.62) saturate(1.3);opacity:.55;z-index:0}
.np>*{position:relative;z-index:1}
.cov{width:96px;height:96px;background:#dfe3ea center/cover;border:1px solid #b5bcc9;display:grid;place-items:center;color:#98a1b3;font-size:36px}
.np>div:last-child{min-width:0}
.np h3{font-size:14px;line-height:1.2;max-height:34px;overflow:hidden}
.np p{color:#59606e;font-size:12px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pg{position:absolute;left:10px;right:10px;bottom:10px;z-index:1}
.tr{height:11px;border:1px solid #8d95a6;border-radius:6px;background:linear-gradient(#cfd5df,#f2f4f8);overflow:hidden;cursor:pointer;touch-action:none}
.fl{height:100%;width:0;background:linear-gradient(var(--b1),var(--b2))}
.tm{display:flex;justify-content:space-between;font-size:11px;color:#444;margin-top:2px}
.lyr{position:relative;height:100%;overflow:hidden;padding:8px 12px;text-align:center}
.lyr p{padding:4px 0;color:#8a92a0}
.lyr p.on{color:#111;font-weight:700;font-size:15px}
#view canvas{width:100%;height:100%;display:block;background:#0e1a33}
#toast{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(20,24,34,.9);color:#fff;padding:4px 12px;border-radius:12px;font-size:11px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;z-index:9}
#toast.on{opacity:1}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.wheel{position:absolute;left:55px;bottom:34px;width:230px;height:230px;border-radius:50%;background:var(--wh);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12),0 1px 0 rgba(255,255,255,.6);touch-action:none}
.k{position:absolute;color:var(--lbl);font-weight:700;font-size:11px;letter-spacing:.08em;width:44px;height:30px;display:grid;place-items:center}
.k svg{height:14px}
.k.m{top:12px;left:93px}.k.l{left:10px;top:100px}.k.r{right:10px;top:100px}.k.p{bottom:12px;left:93px}
.k.p svg{width:24px}
#ctr{position:absolute;left:73px;top:73px;width:84px;height:84px;border-radius:50%;background:var(--ctr);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15),0 1px 2px rgba(0,0,0,.25)}
#ctr:active{filter:brightness(.94)}
.hint{max-width:340px;text-align:center;font-size:12px;line-height:1.6;color:#7c8194}
.drag .pod{outline:3px dashed #5aa0f0;outline-offset:8px}
.pod.red{--body:linear-gradient(155deg,#ff7b7b,#c1121f 55%,#e5383b);--wh:radial-gradient(circle at 50% 30%,#fff,#e6dcdc);--lbl:#b06a6a;--ctr:radial-gradient(circle at 50% 30%,#f7f0f0,#d1c3c3)}
.pod.green{--body:linear-gradient(155deg,#c6f0b0,#5fb04a 55%,#9ad884);--wh:radial-gradient(circle at 50% 30%,#fff,#dbe8d6);--lbl:#6f8a66;--ctr:radial-gradient(circle at 50% 30%,#f6faf4,#c8d8c2)}
.dark .scr{background:#0f1116;color:#eaeef7}.dark .bar{background:linear-gradient(#3b414f,#1c2029);border-color:#000}.dark .bar i{color:#aab}
.dark .row .r{color:#8b93a6}.dark .np p{color:#9aa3b6}.dark .lyr p{color:#6f778a}.dark .lyr p.on{color:#fff}.dark .msg{color:#9aa3b6}
.dark .tr{background:linear-gradient(#20242e,#2b303c);border-color:#000}.dark .tm{color:#aab}.dark .cov{background-color:#242833;border-color:#000}
#view{will-change:transform}
.cov.in{animation:pop .5s cubic-bezier(.2,1.3,.3,1)}
@keyframes pop{from{transform:scale(.6) rotateY(50deg);opacity:0}}
#boot{position:absolute;inset:0;z-index:5;background:#000;display:grid;place-items:center;color:#fff;font-size:30px;letter-spacing:-.03em;transition:opacity .6s;pointer-events:none}
#boot b{animation:glow 1.1s ease-out both}
@keyframes glow{from{opacity:0;transform:scale(.9)}}
#boot.off{opacity:0}
.k{transition:transform .08s}.k:active{transform:scale(.88)}
#dot{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:rgba(0,0,0,.1);opacity:0;transition:opacity .15s;pointer-events:none}
.pod.black #dot{background:rgba(255,255,255,.14)}
.flow{position:relative;height:100%;background:linear-gradient(#0b0c10,#2a2e3a 70%,#0b0c10);perspective:420px;overflow:hidden}
.flow .cv{position:absolute;left:50%;top:22px;width:92px;height:92px;margin-left:-46px;background:#dfe3ea center/cover;display:grid;place-items:center;color:#fff;font-size:34px;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .35s;box-shadow:0 8px 18px rgba(0,0,0,.6);-webkit-box-reflect:below 1px linear-gradient(transparent 60%,rgba(255,255,255,.25))}
.flow .cap{position:absolute;left:0;right:0;bottom:6px;text-align:center;color:#fff;line-height:1.3;padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flow .cap span{display:block;color:#9aa3b6;font-size:11px}
.pod{isolation:isolate;transition:transform .25s ease-out;will-change:transform;
background:repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 1px,transparent 1px 3px),var(--body);
box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.7),inset 0 3px 2px rgba(255,255,255,.85),inset 0 -8px 16px rgba(0,0,0,.16),0 40px 70px -10px rgba(0,0,0,.6),0 0 0 1px #6f7176,0 0 0 2px rgba(255,255,255,.12)}
.pod::before{content:"";position:absolute;inset:0;border-radius:inherit;z-index:1;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.26),transparent 30%,transparent 70%,rgba(255,255,255,.12))}
.pod.black::before{opacity:.35}
.pod::after{content:"";position:absolute;left:6%;right:6%;bottom:-30px;height:30px;z-index:-1;background:radial-gradient(closest-side,rgba(0,0,0,.6),transparent);filter:blur(3px)}
.pod.pink{--body:linear-gradient(155deg,#ffd3e6,#f277ad 55%,#ffb1d2);--wh:radial-gradient(circle at 50% 30%,#fff,#f0dbe5);--lbl:#b07892;--ctr:radial-gradient(circle at 50% 30%,#fff5f9,#ddc4d0)}
.pod.gold{--body:linear-gradient(155deg,#f6e7b4,#c9a24a 55%,#ebd58f);--wh:radial-gradient(circle at 50% 30%,#fffdf5,#e8dfc6);--lbl:#95814a;--ctr:radial-gradient(circle at 50% 30%,#fffbea,#d6c9a0)}
.hs{position:absolute;top:-7px;right:30px;width:50px;height:8px;padding:0;border-radius:5px 5px 0 0;background:linear-gradient(#f2f3f5,#a9abb0);border:1px solid #7a7c82;border-bottom:0}
.hs::after{content:"";position:absolute;top:1px;left:2px;width:22px;height:5px;border-radius:3px;background:linear-gradient(#fff,#c9cbd0);transition:transform .18s}
.hs.on{background:linear-gradient(#ffb066,#ff7a1a)}.hs.on::after{transform:translateX(22px)}
.bez{box-shadow:inset 0 0 0 1px #000,inset 0 3px 8px rgba(0,0,0,.9),0 1px 0 rgba(255,255,255,.7)}
.scr{box-shadow:inset 0 0 26px rgba(0,0,0,.22)}
.scr::after{content:"";position:absolute;inset:0;z-index:8;pointer-events:none;background:linear-gradient(158deg,rgba(255,255,255,.22),rgba(255,255,255,.04) 42%,transparent 43%)}
.bar{box-shadow:inset 0 1px 0 rgba(255,255,255,.9)}
.bar i{width:44px}.bar i:last-child{display:flex;justify-content:flex-end;align-items:center;gap:5px}
.batt{display:inline-block;width:21px;height:10px;border:1px solid #3b4352;border-radius:2px;padding:1px;position:relative}
.batt::after{content:"";position:absolute;right:-3px;top:2px;width:2px;height:4px;background:#3b4352;border-radius:0 1px 1px 0}
.batt b{display:block;height:100%;width:100%;background:linear-gradient(#a6ec86,#3ea52e);border-radius:1px;transition:width .5s}
.row.sel{background:linear-gradient(rgba(255,255,255,.28),rgba(255,255,255,0) 52%),linear-gradient(var(--b1),var(--b2));text-shadow:0 1px 1px rgba(0,0,0,.25)}
#view.split .row{width:60%}#view.split .sb{right:41%}
.pv{position:absolute;right:0;top:0;bottom:0;width:40%;display:grid;place-items:center;background:linear-gradient(90deg,#eef1f6,#fff);border-left:1px solid #c7ccd8}
.dark .pv{background:linear-gradient(90deg,#181b23,#0f1116);border-color:#000}
.cov{-webkit-box-reflect:below 1px linear-gradient(transparent 68%,rgba(0,0,0,.18))}
.st5{color:#e0a020!important;letter-spacing:1px;font-size:13px!important}
#dim{position:absolute;inset:0;background:#000;opacity:0;transition:opacity 1.4s;pointer-events:none;z-index:7}.dimmed #dim{opacity:.86}
.wheel{background:radial-gradient(circle at 50% 26%,rgba(255,255,255,.85),rgba(255,255,255,0) 55%),var(--wh);
box-shadow:inset 0 0 0 1px rgba(0,0,0,.14),inset 0 6px 8px rgba(255,255,255,.7),inset 0 -9px 14px rgba(0,0,0,.08),0 1px 0 rgba(255,255,255,.75),0 -1px 2px rgba(0,0,0,.12)}
#ctr{box-shadow:inset 0 0 0 1px rgba(0,0,0,.16),inset 0 2px 3px rgba(255,255,255,.9),inset 0 -3px 5px rgba(0,0,0,.08),0 0 0 4px rgba(0,0,0,.05),0 2px 3px rgba(0,0,0,.25)}
:focus{outline:none}
:focus-visible{outline:2px solid var(--b1);outline-offset:2px;border-radius:3px}
</style>
</head>
<body>
<div id="podwrap">
<div class="pod" id="pod">
  <button class="hs" id="hs" aria-label="Hold switch" aria-pressed="false"></button>
  <div class="bez"><div class="scr">
    <div class="bar"><i id="st"></i><b id="hd">Pod</b><i id="zz"><span id="sl"></span><span class="batt"><b id="bb"></b></span></i></div>

    <button class="k p" id="bt" aria-label="Play or pause"><svg viewBox="0 0 26 16"><path d="M1 0v16l11-8zM16 0h4v16h-4zM22 0h4v16h-4z" fill="currentColor"/></svg></button>
    <i id="dot"></i>
    <button id="ctr" aria-label="Select"></button>
  </div>
</div>
</div>

  if(e === 1 || e === 2){ while(i < d.length && !(d[i] === 0 && d[i+1] === 0)) i += 2; i += 2; }

async function tags(f){

    const h = new Uint8Array(await f.slice(0,10).arrayBuffer());
    if(String.fromCharCode(h[0],h[1],h[2]) !== 'ID3' || h[3] < 3) return o;
    const size = ((h[6]&127)<<21)|((h[7]&127)<<14)|((h[8]&127)<<7)|(h[9]&127);

      if(!/^[A-Z0-9]{4}$/.test(id)) break;
      const n = v4 ? ((b[p+4]&127)<<21)|((b[p+5]&127)<<14)|((b[p+6]&127)<<7)|(b[p+7]&127)

  .replace(/[\(\[][^)\]]*\b(remaster\w*|live|version|edit|mono|stereo|explicit|clean|deluxe|bonus track|acoustic|demo|single)\b[^)\]]*[\)\]]/gi,'')

  // 2: search by title+artist

/* ---------- cover-color accent, cover flow, marquee ---------- */
const hash = s => [...s].reduce((a,c) => (a*31 + c.charCodeAt(0)) % 360, 7);

    const c = document.createElement('canvas'); c.width = c.height = 1; const x = c.getContext('2d'); x.drawImage(im,0,0,1,1);

/* ---------- render loop: smooth progress, visualizer (3 modes), clock ---------- */
let vm = 0; const vz = new Float32Array(32);
(function loop(){
  requestAnimationFrame(loop);
  const s = cs(); if(!s) return;
  if(s.type === 'np' && !audio.paused) tick();
  if(s.type === 'clock'){
    const e = $('#ck'), d = new Date(), tm = d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
    if(e && e.dataset.v !== tm){ e.dataset.v = tm; e.innerHTML = esc(tm) + `<div style="font-size:13px;font-weight:400;margin-top:6px">${esc(d.toLocaleDateString([], {weekday:'long', month:'long', day:'numeric'}))}</div>`; }
    return;

  const c = cv.getContext('2d'), W = cv.width, H = cv.height, live = an && !audio.paused;
  c.fillStyle = 'rgba(14,26,51,.38)'; c.fillRect(0,0,W,H);
  const g = c.createLinearGradient(0,H,0,0); g.addColorStop(0,'#1f68d0'); g.addColorStop(1,'#8fd0ff'); c.fillStyle = g; c.strokeStyle = '#8fd0ff';
  if(live){ if(vm === 2) an.getByteTimeDomainData(td); else an.getByteFrequencyData(fd); }

    for(let i = 0; i < 128; i++){ const x = i/127*W, y = live ? td[i*8]/255*H : H/2; i ? c.lineTo(x,y) : c.moveTo(x,y); }
